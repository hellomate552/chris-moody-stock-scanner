name: Daily Chris Moody Stock Scanner

on:
  schedule:
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Dual Stock Scanner
        run: python chris_moody_scanner.py

      - name: Commit and Push Updated Scans & Watchlists
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Daily Stock Scan Update"
          branch: main
          file_pattern: 'Screener_1_With_Dollar1_Move/** Screener_2_No_Dollar1_Limit/** logs/**'
